<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Formulario para cambio de contraseña del taller Front-End.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="assets/css/style.css">
  <title>Cambiar contraseña | Taller Front-End</title>
</head>
<body>
  <div class="preloader" id="preloader" hidden aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>Validando formulario…</span></div>
  <header class="site-header"><a class="brand" href="index.html">Taller Front-End</a><button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menú</button>
    <nav id="site-nav" class="site-nav" aria-label="Navegación principal"><a href="index.html">Iniciar sesión</a><a href="register.html">Crear cuenta</a><a href="forgot-password.html">Recuperar contraseña</a></nav>
  </header>
  <main class="page-main"><section class="auth-card" aria-labelledby="page-title"><p class="eyebrow">Seguridad de la cuenta</p><h1 id="page-title">Cambiar contraseña</h1><p class="intro">Define la nueva contraseña para tu cuenta.</p>
    <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
    <form data-auth-form data-success="Formulario validado. Para guardar el cambio se necesita un backend.">
      <label for="password">Nueva contraseña</label><input id="password" name="password" type="password" autocomplete="new-password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}" title="Usa al menos 8 caracteres, una mayúscula, una minúscula y un número." required>
      <label for="confirm-password">Confirmar contraseña</label><input id="confirm-password" name="confirmPassword" type="password" autocomplete="new-password" required>
      <button class="primary-button" type="submit">Cambiar contraseña</button>
    </form><div class="card-links"><a href="index.html">Volver al inicio de sesión</a></div>
  </section></main>
  <footer class="site-footer"><p>Ejercicio académico de Front-End · Sin conexión a un backend</p></footer><script src="assets/js/main.js" defer></script>
</body>
</html>
