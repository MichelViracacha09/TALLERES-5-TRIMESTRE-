<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Taller de formularios de autenticación con HTML, CSS y JavaScript.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
  <title>Iniciar sesión | Taller Front-End</title>
</head>
<body>
  <div class="preloader" id="preloader" hidden aria-live="polite"><span class="spinner" aria-hidden="true"></span><span>Validando formulario…</span></div>
  <header class="site-header">
    <a class="brand" href="index.html">Taller Front-End</a>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">Menú</button>
    <nav id="site-nav" class="site-nav" aria-label="Navegación principal">
      <a href="index.html" aria-current="page">Iniciar sesión</a>
      <a href="register.html">Crear cuenta</a>
      <a href="forgot-password.html">Recuperar contraseña</a>
    </nav>
  </header>
  <main class="page-main">
    <section class="auth-card" aria-labelledby="page-title">
      <p class="eyebrow">Acceso a tu cuenta</p>
      <h1 id="page-title">Iniciar sesión</h1>
      <p class="intro">Ingresa tu usuario y contraseña.</p>
      <p class="form-message" id="form-message" role="status" aria-live="polite"></p>
      <form data-auth-form data-success="Formulario validado. Esta demostración no incluye un servidor de autenticación.">
        <label for="username">Usuario</label>
        <input id="username" name="username" type="text" autocomplete="username" pattern="[a-zA-Z0-9_]{4,20}" title="Usa entre 4 y 20 letras, números o guiones bajos." required>
        <label for="password">Contraseña</label>
        <input id="password" name="password" type="password" autocomplete="current-password" pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}" title="Usa al menos 8 caracteres, una mayúscula, una minúscula y un número." required>
        <button class="primary-button" type="submit">Ingresar</button>
      </form>
      <div class="card-links"><a href="register.html">Crear una cuenta</a><a href="forgot-password.html">¿Olvidaste tu contraseña?</a></div>
    </section>
  </main>
  <footer class="site-footer"><p>Ejercicio académico de Front-End · Sin conexión a un backend</p></footer>
  <script src="assets/js/main.js" defer></script>
</body>
</html>
